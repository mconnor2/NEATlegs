# Mass 1.258 kg, weight 12.58 N, head at 1.53 m, barrel at 1.03 m.  Centre
# of mass x = 0.050 between hooves at x = -0.450 and 0.420.  Joint limits are
# relative to the standing start pose.

global: {
    popSize = 1000;
    startPopulationPercent = 0.5;

    //Run ends when the head drops below this height (m)
    headFloor = 0.9;

    //Only the hooves may touch the ground; any other limb touching ends
    // the run
    groundLimbs = ("hindHoofL", "hindHoofR", "foreHoofL", "foreHoofR");

    //Fitness = (max head x + fitnessBase) * (fraction of the run survived)
    // ^ survivalExponent.  The run also ends once the energy cost
    // reaches energyBudget (J, 0 for none), which counts as surviving.
    fitnessBase = 0.1;
    survivalExponent = 0.5;
    energyBudget = 0.0;

    //Energy cost = positiveWork * W+ + negativeWork * |W-| + forceTime *
    // integral of |muscle force| dt (J per N s)
    energyCost = { positiveWork = 4; negativeWork = 0.8333; forceTime = 1; };

    //Mating probabilities:
    inheritAllLinks = false;
    inheritDominant = 0.9;
    linkEnabledRate = 0.1;

    weightMutationRate   = 0.8;
    weightPerturbScale   = 0.1;
    weightPerturbNormal  = 0.6;
    weightPerturbUniform = 0.39;

    addLinkMutationRate = 0.05;
    addNodeMutationRate = 0.05;

    //Mirror symmetry (the mirror section): share of initial link pairs
    // tied, chance a new node or link comes with its tied mirror image,
    // and chance per child that each tied pair is untied for good
    mirrorInitTied = 1;
    mirrorStructure = 1;
    untieRate = 0.0;

    compatGDiff = 1.0;
    compatWDiff = 0.4;

    compatThresh = 3.0;

    singleMate = 0.2;
    specieMate = 0.99;

    oldAge = 5;

    //A species stops reproducing after this many generations without
    // improving; only its fittest survivalThreshold breed
    dropoffAge = 15;
    survivalThreshold = 0.2;

    targetSpecies = 10;
    threshAdapt = 0.2;

    //nInput/nOutput are computed from sensors and muscles
    nInput = 15;
    nOutput = 16;
};

