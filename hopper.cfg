
# Scaled from the original 17 m hopper to ~2 m tall (s = 2/17) so its numbers
# are comparable with the walker.  Froude scaling keeps the dynamics it was
# tuned for: lengths * s, mass * s^2 (2D, same densities), spring k * s,
# damping kd * s^1.5, angularDamping / sqrt(s).  Angles are unchanged.
global: {
    popSize = 2000;
    startPopulationPercent = 0.5;
    
    //6 inputs, 4 outputs for two muscles
    nInput = 6; 
    nOutput = 4;

    //Mating probabilities:
    inheritAllLinks = false;
    inheritDominant = 0.9;
    linkEnabledRate = 0.1;

    weightMutationRate   = 0.2;
    weightPerturbScale   = 0.1;
    weightPerturbNormal  = 0.6;
    weightPerturbUniform = 0.39;
    
    addLinkMutationRate = 0.2;
    addNodeMutationRate = 0.05;
    
    compatGDiff = 1.0;
    compatWDiff = 0.4;
    
    compatThresh = 7.0;
    specieMate = 0.99;

    oldAge = 5;
    
    targetSpecies = 20;
    threshAdapt = 0.2;
};


